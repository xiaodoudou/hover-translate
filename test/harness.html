<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hover Translate logic harness</title>
<!-- The clipped-line handling is CSS and JS together: the module measures and marks, the stylesheet
     moves or grows the box. Without this the marking would be checked against nothing. -->
<link rel="stylesheet" href="../src/styles/content.css">
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 2rem; }
  #results { font-family: ui-monospace, monospace; white-space: pre-wrap; }
  .pass { color: #15803d; } .fail { color: #b91c1c; font-weight: 700; }
  #stage { border: 1px solid #e2e8f0; padding: 1rem; margin-top: 2rem; opacity: .5; }
  .clip { display: block; width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The other cut a page makes, taken from a real product card: the row is one line tall and hides
     what wraps past it, and the title inside it is inline, so it cannot be measured for the cut. */
  .row { width: 120px; height: 20px; overflow: hidden; line-height: 20px; }
  .row > .title { display: inline; }
  /* And a window several lines tall, which is a paragraph cut short rather than a line. */
  .clamp { width: 120px; line-height: 20px; display: -webkit-box; -webkit-box-orient: vertical;
           -webkit-line-clamp: 3; overflow: hidden; }
</style>
</head>
<body>
<h1>Logic harness</h1>
<p>Runs the real <code>block.js</code>, <code>richtext.js</code>, <code>marquee.js</code> and
<code>script.js</code> against the fixture DOM. Serve the extension folder over http and open this
page: module imports do not work from <code>file://</code>.</p>
<div id="results">running...</div>
<p id="quick-words">Words for the quick key to have something to act on.</p>
<input id="quick-field" type="text">
<textarea id="quick-area">Text nobody but the person typing it owns.</textarea>
<div id="stage"></div>

<script type="module">
import { resolveBlock } from "../src/content/block.js";
import { resolveImage, imageUrl, showImageOverlay, hideImageOverlay, hideAllImageOverlays, hasImageOverlay,
         showImagePending, hideImagePending } from "../src/content/image.js";
import { serialize, applyInPlace, rebuild } from "../src/content/richtext.js";
import { markOverflow, clearOverflow, setClippedLines } from "../src/content/marquee.js";
import { hasScriptForeignTo, pickLanguage, languageFromScript, scriptGroup } from "../src/lib/script.js";
import { installHover } from "../src/content/hover.js";
import { takeSelection, selectionAt } from "../src/content/selection.js";
import { targetForGroup, usableOrder } from "../src/lib/settings.js";

const out = [];
let failures = 0;

function check(name, condition, detail = "") {
  if (condition) out.push(`<span class="pass">PASS</span> ${name}`);
  else { failures++; out.push(`<span class="fail">FAIL</span> ${name} ${detail}`); }
}

const html = await (await fetch("./fixture.html")).text();
const doc = new DOMParser().parseFromString(html, "text/html");
document.getElementById("stage").append(...doc.body.childNodes);

const q = (sel) => document.querySelector(sel);
const byText = (sel, needle) =>
  [...document.querySelectorAll(sel)].find((el) => el.textContent.includes(needle));
const probe = (fragment) => {
  const box = document.createElement("div");
  box.append(fragment);
  return box;
};

// --- block resolution ---------------------------------------------------
const nested = byText("p", "dois spans aninhados");
check("inner nested span resolves to its paragraph",
  resolveBlock(nested.querySelector("span span")) === nested);
check("text node inside a paragraph resolves to the paragraph",
  resolveBlock(nested.querySelector("span span").firstChild) === nested);
check("code inside pre is refused", resolveBlock(q("pre code")) === null);
check("icon font is refused", resolveBlock(q("i.fa")) === null);
check("aria-hidden decoration is refused", resolveBlock(q('span[aria-hidden="true"]')) === null);
// The attribute speaks for the element it is on, not for everything under it: a dialog marks the
// page behind it aria-hidden while leaving it on screen, and Taobao's sidebar marks every category
// panel aria-hidden while showing it expanded.
const staleRow = q("#stale-region a").firstChild;
check("a row inside a region only claimed to be hidden still resolves",
  resolveBlock(staleRow)?.tagName === "H4", String(resolveBlock(staleRow)?.tagName));
check("notranslate paragraph is refused", resolveBlock(q("p.notranslate")) === null);
check("textarea is refused", resolveBlock(q("textarea")) === null);
const li = byText("li", "Eerste punt");
check("list item resolves to itself, not the list", resolveBlock(li) === li);
const td = byText("td", "Łączy");
check("table cell resolves to itself", resolveBlock(td) === td);

// --- images: recognised lines are painted over the image ------------------
const inlineLogo = byText("p", "il nostro logo").querySelector("img");
check("an inline image is recognised", resolveImage(inlineLogo) === inlineLogo);
check("a paragraph is not an image", resolveImage(byText("p", "il nostro logo")) === null);
check("a data: image is still usable, since the bytes are read locally",
  imageUrl(inlineLogo)?.startsWith("data:image/svg") === true);

const pic = document.createElement("picture");
const picImg = document.createElement("img");
picImg.src = "../icons/128.png";
pic.append(picImg);
document.getElementById("stage").append(pic);
check("a picture resolves to the img it wraps", resolveImage(pic) === picImg);

// The overlay is measured against a real laid-out image, so the fixture one is used.
const shot = document.getElementById("remote-image");
await new Promise((done) => (shot.complete ? done() : shot.addEventListener("load", done, { once: true })));
const OCR_LINES = [
  { text: "Welcome to the shop", x: 0, y: 0, w: 128, h: 20, color: "rgb(17,17,17)", background: "rgb(255,255,255)" },
  { text: "No smoking", x: 0, y: 40, w: 128, h: 20, color: "rgb(17,17,17)", background: "rgb(255,255,255)" },
];
// --- the loading bar, which stands in for the gradient the text path paints ---
const pendingCount = () => document.querySelectorAll('body > [data-ht-ui="image-pending"]').length;
check("a loading bar goes up as soon as the trigger fires", showImagePending(shot) === true);
check("and it is one host, anchored on the image", pendingCount() === 1);
check("it is not counted as a finished overlay", hasImageOverlay(shot) === false);
check("the bar comes away again", hideImagePending(shot) === true);
check("leaving nothing behind", pendingCount() === 0);
check("clearing a bar that is not there is a no-op", hideImagePending(shot) === false);

// The result replaces the bar rather than stacking on top of it.
showImagePending(shot);
check("showing the result clears the bar", showImageOverlay(shot, { lines: OCR_LINES }) === true);
check("so only the finished overlay is left", pendingCount() === 0 && hasImageOverlay(shot) === true);
hideImageOverlay(shot);

check("the overlay goes up", showImageOverlay(shot, { lines: OCR_LINES }) === true);
check("and it is tracked against its image", hasImageOverlay(shot) === true);

const overlayHost = document.querySelector('body > [data-ht-ui="image"]');
const shotRect = shot.getBoundingClientRect();
check("the overlay is anchored over the image",
  Math.abs(parseFloat(overlayHost.style.left) - (shotRect.left + scrollX)) < 1 &&
    Math.abs(parseFloat(overlayHost.style.top) - (shotRect.top + scrollY)) < 1,
  `${overlayHost.style.left},${overlayHost.style.top} vs ${shotRect.left + scrollX},${shotRect.top + scrollY}`);
check("and sized to it",
  Math.abs(parseFloat(overlayHost.style.width) - shotRect.width) < 1);
check("the page itself gained no node inside the image's parent",
  shot.parentElement.querySelectorAll("[data-ht-ui]").length === 0);
check("the overlay does not swallow clicks", overlayHost.style.pointerEvents === "none");

check("tapping the image again takes the overlay away", hideImageOverlay(shot) === true);
check("nothing is left tracked", hasImageOverlay(shot) === false);
check("and the host is gone from the page", overlayHost.isConnected === false);
check("hiding an image with no overlay is a no-op", hideImageOverlay(shot) === false);

// The other shape: a provider that translated as it read hands back a finished picture.
check("a rendered picture is shown instead of boxes when a provider returns one",
  showImageOverlay(shot, { image: "../icons/128.png" }) === true);
const renderedHost = document.querySelector('body > [data-ht-ui="image"]');
check("and it is one image, not a stack of line boxes",
  renderedHost !== null && hasImageOverlay(shot) === true);
hideImageOverlay(shot);

showImageOverlay(shot, { lines: OCR_LINES });
check("escape clears every image overlay", hideAllImageOverlays() === 1);
check("and clearing again finds none", hideAllImageOverlays() === 0);

// --- the real world case: an order row -----------------------------------
const cell = q("#order-cell");
const cellPlan = serialize(cell);
check("the order cell serialises", cellPlan !== null);
check("every element became a numbered tag", cellPlan?.elements.length === 8,
  JSON.stringify(cellPlan?.elements.map((e) => e.node.tagName)));
check("the disabled input is opaque, sent as an empty pair",
  cellPlan?.elements[2].node.tagName === "INPUT" && cellPlan.elements[2].opaque === true &&
    cellPlan.text.includes("<b2></b2>"), JSON.stringify(cellPlan?.text));
check("only the text is sent, tags carry the structure",
  cellPlan?.text ===
  "<b0><b1><b2></b2></b1><b3>2026-07-23</b3></b0><b4><b5>订单号</b5><b6>: </b6><b7>3313704182876019697</b7></b4>",
  JSON.stringify(cellPlan?.text));

// Exactly what the engines returned when this was tested against them.
const cellReply =
  "<b0><b1><b2></b2></b1><b3>2026-07-23</b3></b0><b4><b5>Order number</b5><b6>: </b6><b7>3313704182876019697</b7></b4>";
const cellBox = probe(rebuild(cellReply, cellPlan.elements));

check("the label survives", cellBox.querySelector("label.checkbox-label") !== null, cellBox.innerHTML);
check("the checkbox span survives", cellBox.querySelector("span.checkbox") !== null);
check("the disabled input survives with its attributes",
  cellBox.querySelector('input[type="checkbox"]')?.disabled === true, cellBox.innerHTML);
check("the date keeps its own create-time span, so it stays bold",
  cellBox.querySelector("span.create-time")?.textContent === "2026-07-23", cellBox.innerHTML);
check("the order number keeps its data attribute",
  cellBox.querySelector("span[data-spm-anchor-id]")?.textContent === "3313704182876019697");
check("only the text changed", cellBox.textContent === "2026-07-23Order number: 3313704182876019697",
  JSON.stringify(cellBox.textContent));
check("the rebuilt tree has the same element count as the original",
  cellBox.querySelectorAll("*").length === cell.querySelectorAll("*").length,
  `${cellBox.querySelectorAll("*").length} vs ${cell.querySelectorAll("*").length}`);

// --- applied in place: not one node created or destroyed ------------------
const cellNodesBefore = [...cell.querySelectorAll("*")];
const cellEdits = applyInPlace(cell, cellReply, serialize(cell));
check("the reply applies by editing text alone", cellEdits !== null);
check("every element is the very same object afterwards",
  [...cell.querySelectorAll("*")].length === cellNodesBefore.length &&
    [...cell.querySelectorAll("*")].every((n, i) => n === cellNodesBefore[i]));
check("the chinese label became english in its own span",
  cell.querySelector("span")?.textContent !== undefined && cell.textContent.includes("Order number"),
  cell.textContent);
check("the date stayed in its create-time span",
  cell.querySelector("span.create-time")?.textContent === "2026-07-23");
check("the input was not disturbed",
  cell.querySelector('input[type="checkbox"]')?.disabled === true);

for (let i = cellEdits.length - 1; i >= 0; i--) cellEdits[i][0].nodeValue = cellEdits[i][1];
check("undoing the edits restores the original text exactly",
  cell.textContent === "2026-07-23订单号: 3313704182876019697", JSON.stringify(cell.textContent));

// --- reordering, which is the whole reason tags are sent ------------------
const fr = byText("p", "canapé rouge");
const frPlan = serialize(fr);
check("a paragraph with a link and a strong serialises", frPlan?.elements.length === 2);
const frBox = probe(rebuild(
  "Nobody <b1>dares</b1> disturb the cat sleeping on the <b0>red sofa</b0>.", frPlan.elements));
check("the link moved to where the translation put it",
  frBox.textContent === "Nobody dares disturb the cat sleeping on the red sofa.",
  JSON.stringify(frBox.textContent));
check("the link kept its href", frBox.querySelector("a")?.getAttribute("href") === "https://example.com");
check("the strong survives with its own translated text",
  frBox.querySelector("strong")?.textContent === "dares", frBox.innerHTML);

// --- styling is never folded away ---------------------------------------
const price = byText("p", "全国联保");
const pricePlan = serialize(price);
const priceBox = probe(rebuild(
  "Priced from <b0>¥199</b0>, with a nationwide warranty.", pricePlan.elements));
check("the short styled span keeps its class",
  priceBox.querySelector("span.price")?.textContent === "¥199", priceBox.innerHTML);

const wrapped = byText("p", "Consultez la");
const wrappedPlan = serialize(wrapped);
const wrappedBox = probe(rebuild(
  "See the <b0><b1>documentation</b1></b0> for details.", wrappedPlan.elements));
check("a wrapper chain keeps both elements",
  wrappedBox.querySelector("a > span.price")?.textContent === "documentation", wrappedBox.innerHTML);

// --- opaque content is never exposed or altered --------------------------
const es = byText("p", "npm install");
const esPlan = serialize(es);
check("a code span is opaque and its text is not sent",
  esPlan.text.includes("<b0></b0>") && !esPlan.text.includes("npm install"), JSON.stringify(esPlan.text));
const esBox = probe(rebuild("Run <b0></b0> in the project folder.", esPlan.elements));
check("the code span comes back byte for byte",
  esBox.querySelector("code")?.textContent === "npm install --save-dev vite", esBox.innerHTML);

const it = byText("p", "il nostro logo");
const itPlan = serialize(it);
const itBox = probe(rebuild("Here is our logo <b0></b0> and a footnote<b1></b1>.", itPlan.elements));
check("the image survives", itBox.querySelector("img") !== null);
check("the superscript survives", itBox.querySelector("sup")?.textContent === "1");

// --- spacing swallowed at a tag boundary ---------------------------------
const spacingPlan = serialize(fr);
const spacingBox = probe(rebuild(
  "The cat sleeps on the<b0>red sofa</b0>today and nobody <b1>dares</b1> to disturb it.",
  spacingPlan.elements, "", spacingPlan.text,
));
check("a space lost before a tag is put back",
  spacingBox.textContent.includes("the red sofa"), JSON.stringify(spacingBox.textContent));
check("and after it too",
  spacingBox.textContent.includes("sofa today"), JSON.stringify(spacingBox.textContent));

const cjkPlan = serialize(byText("p", "全国联保"));
const cjkBox = probe(rebuild("价格<b0>¥199</b0>起", cjkPlan.elements, "", cjkPlan.text));
check("a language without spaces is left alone",
  cjkBox.textContent === "价格¥199起", JSON.stringify(cjkBox.textContent));

// --- stray capitals at tag boundaries ------------------------------------
// Both replies below are verbatim engine output, capitals and all.
const split = document.createElement("p");
split.append(
  document.createTextNode("价格 "),
  Object.assign(document.createElement("span"), { className: "price", textContent: "199元" }),
  document.createTextNode(" 起，支持"),
  Object.assign(document.createElement("span"), { className: "price", textContent: "全国联保" }),
  document.createTextNode("服务。"),
);
document.getElementById("stage").append(split);
const splitPlan = serialize(split);
check("the capitalisation fixture has two elements", splitPlan?.elements.length === 2,
  JSON.stringify(splitPlan?.text));
const splitBox = probe(rebuild(
  "price<b0> 199 yuan</b0> Rise, support<b1> Nationwide warranty</b1> Serve.",
  splitPlan.elements,
  "Prices start from 199 yuan, with nationwide warranty service available.",
));
check("a capital invented at a tag boundary is put back down",
  splitBox.textContent === "price 199 yuan rise, support nationwide warranty serve.",
  JSON.stringify(splitBox.textContent));

const keptBox = probe(rebuild(
  "price<b0> 199 yuan</b0> Rise, support<b1> Nationwide warranty</b1> Serve.",
  splitPlan.elements,
  "",
));
check("without a reference translation nothing is touched",
  keptBox.textContent.includes("Rise"), JSON.stringify(keptBox.textContent));

const properBox = probe(rebuild(
  "Order No.:<b0> July</b0> and<b1> Nationwide</b1> cover.",
  splitPlan.elements,
  "Order No.: July 23, 2026, nationwide cover.",
));
check("a genuine proper noun is left capitalised",
  properBox.textContent.includes("July") && properBox.textContent.includes("nationwide"),
  JSON.stringify(properBox.textContent));

const startBox = probe(rebuild(
  "<b0>Prices</b0> start from 199. <b1>Nationwide</b1> cover.",
  splitPlan.elements,
  "prices start. nationwide cover.",
));
check("the first word of the block keeps its capital",
  startBox.textContent.startsWith("Prices"), JSON.stringify(startBox.textContent));
check("a word after a full stop keeps its capital",
  startBox.textContent.includes(". Nationwide"), JSON.stringify(startBox.textContent));

// --- a mangled reply is refused rather than written into the page ---------
check("a reordering reply cannot be edited in place, so it falls back",
  applyInPlace(fr, "Nobody <b1>dares</b1> disturb the cat on the <b0>red sofa</b0>.", frPlan) === null);
check("the failed attempt left the paragraph exactly as it was",
  fr.textContent.includes("canapé rouge") && fr.textContent.includes("ose"), fr.textContent);

check("a missing element is detected", rebuild("Nobody dares.", frPlan.elements) === null);
check("an unbalanced tag is detected",
  rebuild("<b0>red sofa<b1>dares</b1>.", frPlan.elements) === null);
check("a repeated index is detected",
  rebuild("<b0>a</b0><b0>b</b0><b1>c</b1>", frPlan.elements) === null);
check("an index that was never sent is detected",
  rebuild("<b0>a</b0><b1>b</b1><b9>c</b9>", frPlan.elements) === null);
check("a block whose own text looks like a tag is refused", (() => {
  const el = document.createElement("p");
  el.textContent = "use <b0> to open";
  return serialize(el) === null;
})());

// --- writing system beats the detector ----------------------------------
const MIXED = "奥丁2掌机Odin2游戏机专用DOCK充电扩展坞支持4K60帧输出金属外壳";
const ORDER = "2026-07-18订单号: 3312870351913019697";
check("han text is foreign to english", hasScriptForeignTo(MIXED, "en"));
check("an order number with han is foreign to english", hasScriptForeignTo(ORDER, "en"));
check("han text is not foreign to chinese", !hasScriptForeignTo(MIXED, "zh"));
check("latin brand names are never evidence against a language",
  hasScriptForeignTo("Odin2 DOCK 4K60", "zh") === false);
check("plain english is foreign to nothing", !hasScriptForeignTo("This is plain English.", "en"));
check("kana wins over han for japanese", languageFromScript("これは日本語のテスト") === "ja");
check("han alone falls back to chinese", languageFromScript(MIXED) === "zh");
check("cyrillic falls back to russian", languageFromScript("Это тест") === "ru");
check("a wrong 'en' detection is overruled by the script",
  pickLanguage([{ detectedLanguage: "en", confidence: 0.9 }, { detectedLanguage: "zh", confidence: 0.1 }], MIXED) === "zh");
check("overruled even with no chinese candidate offered",
  pickLanguage([{ detectedLanguage: "en", confidence: 0.99 }], ORDER) === "zh");
check("genuine english is still detected as english",
  pickLanguage([{ detectedLanguage: "en", confidence: 0.95 }], "This paragraph is already in English.") === "en");
check("low confidence on latin text yields nothing",
  pickLanguage([{ detectedLanguage: "en", confidence: 0.1 }], "hmm") === null);

// --- which row of the quick-translate mapping a selection lands in ---------
check("plain english is latin", scriptGroup("Select part of this sentence.") === "latin");
check("french is latin too, since no script separates them",
  scriptGroup("Le chat dort sur le canapé rouge.") === "latin");
check("digits and punctuation alone are latin", scriptGroup("2026-07-18 :: 3312870") === "latin");
check("chinese is han", scriptGroup(MIXED) === "han");
check("japanese is kana even where kanji outnumber it",
  scriptGroup("これは日本語のテスト用の段落です。翻訳の対象。") === "kana");
check("korean with a stray hanja is still korean",
  scriptGroup("이것은 한국어 문단입니다 韓") === "hangul");
check("russian is cyrillic", scriptGroup("Это тестовый абзац на русском языке.") === "cyrillic");
check("arabic is arabic", scriptGroup("هذه فقرة اختبارية باللغة العربية.") === "arabic");
// Nothing in the mapping answers to thai, so it has to fall through to the catch-all row.
check("a script with no row of its own is not latin", scriptGroup("นี่คือการทดสอบ") === "thai");

// --- a wrapper is never the target ----------------------------------------
// Pointing at the gap between a header, an article and a footer used to resolve to the element
// holding all three, so one tap rewrote the whole page.
const wrapper = document.createElement("div");
wrapper.innerHTML = `<header>站点导航 首页 分类</header>
  <div class="art"><h1>标题</h1><p class="para">这是一段正文，用来测试。</p></div>
  <footer>页脚 版权所有</footer>`;
document.getElementById("stage").append(wrapper);
check("a wrapper holding blocks is refused", resolveBlock(wrapper) === null,
  String(resolveBlock(wrapper)?.tagName));
check("but the paragraph inside it still resolves",
  resolveBlock(wrapper.querySelector(".para")) === wrapper.querySelector(".para"));
check("and so does the heading", resolveBlock(wrapper.querySelector("h1"))?.tagName === "H1");

// Counting only direct children missed this: every layer has exactly one child, so none of them
// looked like a wrapper and the outermost one swallowed the page.
const chain = document.createElement("div");
chain.innerHTML =
  `<div><div><div><header>站点导航 首页</header><p class="deep">这是一段正文。</p></div></div></div>`;
document.getElementById("stage").append(chain);
check("a chain of single-child wrappers is refused", resolveBlock(chain) === null,
  String(resolveBlock(chain)?.className));
check("and the paragraph at the bottom of it still resolves",
  resolveBlock(chain.querySelector(".deep"))?.className === "deep");

// GitHub puts the whole conversation in custom elements, which no list of tag names can enumerate.
const partials = document.createElement("div");
partials.innerHTML =
  `<rails-partial style="display:contents"><div>第一段文字在这里。</div></rails-partial>` +
  `<rails-partial style="display:contents"><div>第二段文字在这里。</div></rails-partial>`;
document.getElementById("stage").append(partials);
check("blocks held in custom elements still count as passages", resolveBlock(partials) === null,
  String(resolveBlock(partials)?.tagName));

// The tag list names what pages are usually built from, and a feed of custom elements is named by
// nothing in it. Gating the answer on the list alone walked past the post under the pointer.
const feed = document.createElement("div");
feed.innerHTML =
  `<my-post style="display:block">第一条动态，内容足够长。</my-post>` +
  `<my-post style="display:block">第二条动态，内容也足够长。</my-post>`;
document.getElementById("stage").append(feed);
check("a post laid out as a block resolves to itself, not to the feed",
  resolveBlock(feed.firstElementChild.firstChild)?.tagName === "MY-POST",
  String(resolveBlock(feed.firstElementChild.firstChild)?.tagName));
check("and the feed holding two of them is still refused", resolveBlock(feed) === null,
  String(resolveBlock(feed)?.tagName));

// The climb counted every ancestor, inline ones included, so a paragraph a dozen spans above its
// own text was out of reach.
const buried = document.createElement("p");
buried.innerHTML = "<span>".repeat(14) + "这段文字被很多 span 包着。" + "</span>".repeat(14);
document.getElementById("stage").append(buried);
let innermost = buried;
while (innermost.firstElementChild) innermost = innermost.firstElementChild;
check("text buried under fourteen spans still resolves to its paragraph",
  resolveBlock(innermost.firstChild) === buried, String(resolveBlock(innermost.firstChild)?.tagName));

// A minimum length is a Latin habit. One Han character is a whole word, and a menu of them was
// refused outright.
const oneChar = document.createElement("div");
oneChar.textContent = "赞";
document.getElementById("stage").append(oneChar);
check("a single han character is enough to be worth translating", resolveBlock(oneChar) === oneChar,
  String(resolveBlock(oneChar)));
const oneLetter = document.createElement("div");
oneLetter.textContent = "x";
document.getElementById("stage").append(oneLetter);
check("but a single latin letter is not", resolveBlock(oneLetter) === null,
  String(resolveBlock(oneLetter)?.tagName));

// SVG and MathML report their tag name in the document's own case, so every uppercase set here
// missed them: the never-enter list did nothing and a formula was sent off to be translated.
const drawn = document.createElement("p");
drawn.innerHTML = `A caption <svg width="20" height="20"><text x="0" y="10">图</text></svg> after it.`;
document.getElementById("stage").append(drawn);
check("an svg reports a lowercase tag name", drawn.querySelector("svg").tagName === "svg");
check("pointing inside an svg is refused",
  resolveBlock(drawn.querySelector("text").firstChild) === null,
  String(resolveBlock(drawn.querySelector("text").firstChild)?.tagName));
check("and it is sent as an opaque placeholder, never entered",
  serialize(drawn)?.text === "A caption <b0></b0> after it.", serialize(drawn)?.text);

const formula = document.createElement("p");
formula.innerHTML = `The identity <math><mrow><mi>a</mi><mo>+</mo><mn>1</mn></mrow></math> holds.`;
document.getElementById("stage").append(formula);
check("a formula is passed through whole rather than translated symbol by symbol",
  serialize(formula)?.text === "The identity <b0></b0> holds.", serialize(formula)?.text);

// A flex parent blockifies its children, so a row of links reports display:block on every one of
// them. Taobao's hot-word row under the search box is this exactly, and reading those as separate
// passages refused the whole row.
const hotWords = document.createElement("div");
hotWords.style.display = "flex";
hotWords.innerHTML =
  `<a href="#">券后低至7.7折起</a><a href="#">七夕爆款好礼</a><a href="#">夏日美味8.8折起</a>`;
document.getElementById("stage").append(hotWords);
check("a flex row of links resolves to the row", resolveBlock(hotWords.querySelector("a")) === hotWords,
  String(resolveBlock(hotWords.querySelector("a"))));

// The descent must not refuse everything: one box around one paragraph is still that paragraph.
const solo = document.createElement("div");
solo.innerHTML = `<div><p class="solo">这是唯一的一段话。</p></div>`;
document.getElementById("stage").append(solo);
check("a lone box around one paragraph is kept", resolveBlock(solo) === solo,
  String(resolveBlock(solo)?.tagName));

// A sentence that also holds a nested list is still a sentence: its own loose text decides.
const nestedList = document.createElement("ul");
nestedList.innerHTML = `<li id="outer-li">这是外层的一句话<ul><li>里面还有一条</li></ul></li>`;
document.getElementById("stage").append(nestedList);
check("an item carrying its own text is kept, nested list and all",
  resolveBlock(document.getElementById("outer-li"))?.id === "outer-li");

// --- a <pre> is not automatically code -------------------------------------
// Chat clients render messages into one. Taobao's does, inside its editor component, and refusing
// every <pre> meant refusing every message in the conversation.
const preProse = document.createElement("div");
preProse.innerHTML =
  `<pre class="edit" style="font-family: Roboto, 'PingFang SC', sans-serif; white-space: break-spaces">` +
  `这个我说不好，大部份能用，偶尔会有不能用的。有买家问，我这边都是回复不能用</pre>`;
document.getElementById("stage").append(preProse);
check("a pre styled as prose is translated", resolveBlock(preProse.querySelector("pre"))?.tagName === "PRE",
  String(resolveBlock(preProse.querySelector("pre"))));

const preMono = document.createElement("div");
preMono.innerHTML = `<pre style="font-family: Menlo, monospace">npm install --save-dev vite</pre>`;
document.getElementById("stage").append(preMono);
check("a pre in a monospace font is still refused", resolveBlock(preMono.querySelector("pre")) === null);

const preCode = document.createElement("div");
preCode.innerHTML = `<pre style="font-family: Roboto, sans-serif"><code>const x = 1;</code></pre>`;
document.getElementById("stage").append(preCode);
check("a pre holding code is refused whatever the font",
  resolveBlock(preCode.querySelector("code")) === null);

// --- shadow roots ---------------------------------------------------------
// A listener on the document is handed the host, whose own text is empty. The real node comes from
// composedPath(), so what matters here is that the inner node resolves once it is reached.
const shadowHost = document.createElement("div");
document.getElementById("stage").append(shadowHost);
const shadowRoot = shadowHost.attachShadow({ mode: "open" });
shadowRoot.innerHTML = `<div id="shadow-msg">不太明白您的意思</div>`;
check("the node inside a shadow root resolves to itself",
  resolveBlock(shadowRoot.getElementById("shadow-msg"))?.id === "shadow-msg");
check("the host on its own resolves to nothing", resolveBlock(shadowHost) === null);

// --- lines the page cuts to one width -------------------------------------
// The box that clips is rarely the block that was translated: a sidebar clips the label inside it.
// That box is the one that may slide, and only by exactly what it hides.
const menu = document.createElement("div");
menu.innerHTML = `<span class="clip">A translated line far too long for this box</span>`;
document.getElementById("stage").append(menu);
const label = menu.firstElementChild;
const menuView = menu.firstElementChild.clientWidth;
const menuLine = menu.firstElementChild.scrollWidth;
markOverflow(menu);
const runner = label.querySelector(".ht-marquee-line");
const slide = runner?.getAnimations().find((a) => a.id === "ht-marquee");
const frames = slide?.effect.getKeyframes().map((f) => Math.round(parseFloat(f.transform.match(/-?[\d.]+/)[0])));
check("the box that clips is marked, not the block around it",
  label.classList.contains("ht-marquee") && !menu.classList.contains("ht-marquee"));
check("the line is moved by a transform, which the compositor runs, not by relaying it out",
  !!runner && frames?.length === 2, String(runner?.className));
check("a lap starts with the line off the right edge of the box",
  frames && frames[0] === menuView, JSON.stringify(frames));
check("and ends with it gone past the left one, so the wrap has no seam",
  frames && frames[1] === -menuLine, JSON.stringify(frames));
check("and it waits for the pointer instead of moving on its own", slide?.playState === "paused",
  slide?.playState);
check("waiting exactly where the page drew the line, not off the edge of the box",
  runner.getBoundingClientRect().left === label.getBoundingClientRect().left,
  `${runner.getBoundingClientRect().left} vs ${label.getBoundingClientRect().left}`);

// Where the glyphs actually are. Asserting the property alone would pass on a line that never moved
// a pixel on screen.
const charAt = () => {
  const text = document.createTreeWalker(label, NodeFilter.SHOW_TEXT).nextNode();
  const r = document.createRange();
  r.setStart(text, 0);
  r.setEnd(text, 1);
  return Math.round(r.getBoundingClientRect().left - label.getBoundingClientRect().left);
};
const walk = [];
// Not a sample at 1: the lap is half open, and that instant belongs to the next one.
for (const t of [0, 0.25, 0.5, 0.75, 0.999]) {
  slide.currentTime = t * slide.effect.getComputedTiming().duration;
  walk.push(charAt());
}
slide.cancel();
check("the text itself travels, every sample left of the one before",
  walk.every((x, i) => i === 0 || x < walk[i - 1]), JSON.stringify(walk));
check("starting off the right of the box and ending off the left",
  walk[0] === menuView && Math.abs(walk[4] + menuLine) <= 1, JSON.stringify(walk));
const wasHtml = label.innerHTML;
clearOverflow(menu);
check("reverting takes the marker and the movement with it",
  !label.classList.contains("ht-marquee") && label.getAnimations().length === 0,
  String(label.getAnimations().length));
check("and the wrapper it moved, leaving the box the way it was found",
  !label.querySelector(".ht-marquee-line") && label.childNodes.length === 1 &&
    label.firstChild.nodeType === Node.TEXT_NODE,
  `${wasHtml} -> ${label.innerHTML}`);

const fits = document.createElement("div");
fits.innerHTML = `<span class="clip" style="width: 400px">Short line</span>`;
document.getElementById("stage").append(fits);
markOverflow(fits);
check("a line that fits is left alone", fits.querySelectorAll(".ht-marquee").length === 0);

// text-indent moves the first line of a block container. In a flex box it would indent each item's
// own text rather than slide the row, so those keep their ellipsis.
const row = document.createElement("div");
row.innerHTML = `<div style="display:flex;width:120px;overflow:hidden;white-space:nowrap">` +
  `<span>A translated line far too long for this box</span></div>`;
document.getElementById("stage").append(row);
markOverflow(row);
check("a flex row that clips is left alone", row.querySelectorAll(".ht-marquee").length === 0);

// The other answer: keep the line and let the box grow. It grows downwards, inside the width the
// page gave it, so the column stays where it is.
setClippedLines("grow");
markOverflow(menu);
check("set to grow, the box wraps rather than the line sliding",
  label.classList.contains("ht-unclipped") && !label.classList.contains("ht-marquee"));
check("and the whole line is on screen", label.scrollWidth <= label.clientWidth,
  `${label.scrollWidth} vs ${label.clientWidth}`);
check("at the width the page gave it", Math.round(label.getBoundingClientRect().width) === 120,
  String(label.getBoundingClientRect().width));
clearOverflow(menu);
check("and it goes away again with the translation",
  !label.classList.contains("ht-unclipped") && label.getAttribute("style") === null);

// Only if no space: the same growth, but only where the page had the room already. A row built
// around its one line has none: growing it moves everything below it.
setClippedLines("fit");
const roomy = document.createElement("div");
roomy.style.cssText = "height: 80px";
roomy.innerHTML = `<span class="clip">A translated line far too long for this box</span>`;
document.getElementById("stage").append(roomy);
const roomyBottom = roomy.getBoundingClientRect().bottom;
markOverflow(roomy);
check("set to fit, a box with slack the page already had grows into it",
  roomy.firstElementChild.classList.contains("ht-unclipped"));
check("and the block it sits in still ends where it did",
  roomy.getBoundingClientRect().bottom === roomyBottom,
  `${roomy.getBoundingClientRect().bottom} vs ${roomyBottom}`);
clearOverflow(roomy);

// The sidebar case: the row is as tall as its line, so a second one would push the page around.
const tight = document.createElement("div");
tight.innerHTML = `<span class="clip">A translated line far too long for this box</span>`;
document.getElementById("stage").append(tight);
const tightHeight = tight.getBoundingClientRect().height;
markOverflow(tight);
check("but a row built around its one line slides, rather than shoving the page down",
  tight.firstElementChild.classList.contains("ht-marquee") &&
    !tight.firstElementChild.classList.contains("ht-unclipped"));
check("and the growth it tried was undone",
  tight.getBoundingClientRect().height === tightHeight,
  `${tight.getBoundingClientRect().height} vs ${tightHeight}`);
clearOverflow(tight);

const pinned = document.createElement("div");
pinned.style.cssText = "height: 20px; overflow: hidden";
pinned.innerHTML = `<span class="clip">A translated line far too long for this box</span>`;
document.getElementById("stage").append(pinned);
const oneLine = pinned.firstElementChild.getBoundingClientRect().height;
markOverflow(pinned);
check("and so does a box pinned to one line's height, rather than spilling out of it",
  pinned.firstElementChild.classList.contains("ht-marquee") &&
    !pinned.firstElementChild.classList.contains("ht-unclipped"));
check("with the growth it tried undone too",
  pinned.firstElementChild.getBoundingClientRect().height === oneLine,
  `${pinned.firstElementChild.getBoundingClientRect().height} vs ${oneLine}`);
clearOverflow(pinned);

// --- lines the page cut downwards instead ---------------------------------
// A card gives the row the height its own language needed and hides the rest. Nothing about that is
// visible from inside the block: the title is inline, so all four of its metrics are zero, and the
// row doing the cutting is above it.
const card = document.createElement("div");
card.innerHTML = `<div class="row"><div class="title">A translated line far too long for this box</div></div>`;
document.getElementById("stage").append(card);
const cardRow = card.firstElementChild;
const title = cardRow.firstElementChild;
const cardHeight = card.getBoundingClientRect().height;
check("an inline block cannot be measured for a cut at all",
  title.clientWidth === 0 && title.clientHeight === 0 && title.scrollHeight === 0);
check("and the row above it is hiding a whole line",
  cardRow.scrollHeight - cardRow.clientHeight >= 20, `${cardRow.scrollHeight} vs ${cardRow.clientHeight}`);

setClippedLines("fit");
markOverflow(title);
const flatLine = cardRow.querySelector(".ht-marquee-line");
const across = flatLine?.getAnimations().find((a) => a.id === "ht-marquee");
const flatFrames = across?.effect.getKeyframes().map((f) => f.transform);
check("the row above the block is what gets marked",
  cardRow.classList.contains("ht-marquee") && !title.classList.contains("ht-marquee"));
// A window one line tall is a line, whichever way the page cut it, so it reads across like every
// other one rather than rising through a box that only ever shows one line at a time.
check("the wrap comes out, so the sentence is a single line again",
  getComputedStyle(flatLine).whiteSpace === "nowrap", getComputedStyle(flatLine).whiteSpace);
check("and it moves sideways, not downwards",
  flatFrames?.length === 2 && flatFrames.every((t) => t.startsWith("translateX")), JSON.stringify(flatFrames));
check("a lap starts off the right edge of the box and ends past the left one",
  flatFrames && parseFloat(flatFrames[0].match(/-?[\d.]+/)[0]) === cardRow.clientWidth &&
    parseFloat(flatFrames[1].match(/-?[\d.]+/)[0]) === -flatLine.scrollWidth, JSON.stringify(flatFrames));
check("nothing is left hidden below the box, since there is only the one line now",
  cardRow.scrollHeight - cardRow.clientHeight < 1,
  `${cardRow.scrollHeight} vs ${cardRow.clientHeight}`);
check("and the card is exactly as tall as it was",
  card.getBoundingClientRect().height === cardHeight,
  `${card.getBoundingClientRect().height} vs ${cardHeight}`);

clearOverflow(title);
check("clearing reaches a box above the block, which no selector inside it could find",
  !cardRow.classList.contains("ht-marquee") && !cardRow.querySelector(".ht-marquee-line"));
check("and hands the row its own children back",
  cardRow.firstElementChild === title && card.getBoundingClientRect().height === cardHeight);

setClippedLines("grow");
markOverflow(title);
check("set to grow, the row takes the height its text needs",
  cardRow.classList.contains("ht-unclipped") && cardRow.clientHeight >= 40,
  `${cardRow.className} / ${cardRow.clientHeight}`);
check("which is the whole point: nothing of it is hidden any more",
  cardRow.scrollHeight - cardRow.clientHeight < 1, `${cardRow.scrollHeight} vs ${cardRow.clientHeight}`);
clearOverflow(title);
check("and the card is back to one line when the translation goes",
  card.getBoundingClientRect().height === cardHeight,
  `${card.getBoundingClientRect().height} vs ${cardHeight}`);
setClippedLines("fit");

// The other shape of the same cut: a window several lines tall, which is a paragraph the page cut
// short rather than a line. Undoing the wrap there would leave one line in a box built for three.
const clampBox = document.createElement("div");
clampBox.innerHTML = `<div class="clamp">A translated paragraph that runs on well past the three
  lines this box was built to show, and is cut off where they end</div>`;
document.getElementById("stage").append(clampBox);
const clamped = clampBox.firstElementChild;
const clampHeight = clamped.getBoundingClientRect().height;
markOverflow(clamped);
const column = clamped.querySelector(".ht-marquee-line");
const rise = column?.getAnimations().find((a) => a.id === "ht-marquee");
const risen = rise?.effect.getKeyframes().map((f) => f.transform);
check("a clamped paragraph rises through its window instead",
  risen?.length === 2 && risen.every((t) => t.startsWith("translateY")), JSON.stringify(risen));
check("a lap starts with it below the window and ends with it above",
  risen && parseFloat(risen[0].match(/-?[\d.]+/)[0]) === clamped.clientHeight &&
    parseFloat(risen[1].match(/-?[\d.]+/)[0]) === -clamped.scrollHeight, JSON.stringify(risen));
check("it keeps the lines stacked rather than shrinking them to one",
  getComputedStyle(column).display === "block" && getComputedStyle(column).whiteSpace !== "nowrap",
  `${getComputedStyle(column).display} / ${getComputedStyle(column).whiteSpace}`);
check("and the box is the height the page gave it",
  clamped.getBoundingClientRect().height === clampHeight,
  `${clamped.getBoundingClientRect().height} vs ${clampHeight}`);
clearOverflow(clamped);

// --- the trigger: one tap, or two -----------------------------------------
const trigger = { triggerKey: "Control", triggerTaps: 1, doubleTapMs: 400 };
const fired = [];
installHover({ getConfig: () => trigger, onTrigger: (t) => fired.push(t), onEscape: () => {} });

// Centre of the viewport, so elementFromPoint always has something to return: a press is ignored
// unless the pointer is really over this frame.
const px = Math.round(innerWidth / 2);
const py = Math.round(innerHeight / 2);
// Falling back keeps a bad viewport from aborting the whole run: the checks below then fail and say so.
const hoverTarget = document.elementFromPoint(px, py) || document.getElementById("stage");
const move = () => hoverTarget.dispatchEvent(
  new MouseEvent("mousemove", { bubbles: true, composed: true, clientX: px, clientY: py }));
const press = (type, k = "Control") => document.dispatchEvent(new KeyboardEvent(type, { key: k, bubbles: true }));
const tap = () => { press("keydown"); press("keyup"); };
const naptime = (ms) => new Promise((r) => setTimeout(r, ms));

move();
tap();
check("a single tap fires once", fired.length === 1, `fired ${fired.length}`);
check("and it hands over the hovered node", fired[0] === hoverTarget);

trigger.triggerTaps = 2;
fired.length = 0;
tap();
check("with a double-tap trigger, one tap does nothing", fired.length === 0, `fired ${fired.length}`);
tap();
check("and the second tap fires", fired.length === 1, `fired ${fired.length}`);

fired.length = 0;
tap();
await naptime(trigger.doubleTapMs + 200);
tap();
check("two taps too far apart do not pair", fired.length === 0, `fired ${fired.length}`);
tap();
check("but a tap arriving in time still pairs", fired.length === 1, `fired ${fired.length}`);

// The pair is what makes a modifier safe to use, so a shortcut must not complete one.
fired.length = 0;
tap();
press("keydown");
press("keydown", "c");
press("keyup", "c");
press("keyup");
check("a shortcut in between does not complete the pair", fired.length === 0, `fired ${fired.length}`);
tap();
check("and the broken pair is not resumed by the next tap", fired.length === 0, `fired ${fired.length}`);

// --- quick translate: a key of its own, counted the same way ---------------
const quickConfig = { triggerKey: "Control", triggerTaps: 1, doubleTapMs: 400, quickKey: "Shift", quickTaps: 2 };
const quickFired = [];
installHover({
  getConfig: () => quickConfig,
  onTrigger: () => {},
  onQuick: () => quickFired.push(1),
  onEscape: () => {},
});
const tapQuick = () => { press("keydown", "Shift"); press("keyup", "Shift"); };

tapQuick();
check("one tap of the quick key does nothing", quickFired.length === 0, `fired ${quickFired.length}`);
tapQuick();
check("and the second tap translates the selection", quickFired.length === 1, `fired ${quickFired.length}`);

// Shift is held for a capital, not for this, and the letter in between is what says so.
quickFired.length = 0;
press("keydown", "Shift");
press("keydown", "a");
press("keyup", "a");
press("keyup", "Shift");
tapQuick();
check("typing a capital is not one half of a pair", quickFired.length === 0, `fired ${quickFired.length}`);

// A key of its own is only its own: the trigger's key is not it, whatever is selected.
quickFired.length = 0;
tap();
tap();
check("the trigger's key means nothing to a quick key of its own",
  quickFired.length === 0, `fired ${quickFired.length}`);

// --- one key for both, what is under the pointer saying which -------------
// The default, and what naming the trigger's own key does too. A press is handed to one of the two
// before either counts it, so they never both happen and never both refuse.
const sharedConfig = { triggerKey: "Control", triggerTaps: 1, doubleTapMs: 400, quickKey: "trigger", quickTaps: 2 };
const sharedBlocks = [];
const sharedAsked = [];
let selectionThere = false;
installHover({
  getConfig: () => sharedConfig,
  onTrigger: (target) => sharedBlocks.push(target),
  onQuick: (at) => { sharedAsked.push(at); return true; },
  quickReady: () => selectionThere,
  onEscape: () => {},
});

move();
tap();
check("with nothing selected where the pointer is, a press takes the block",
  sharedBlocks.length === 1 && sharedAsked.length === 0, `${sharedBlocks.length} blocks, ${sharedAsked.length} quick`);

selectionThere = true;
sharedBlocks.length = 0;
tap();
check("with a selection there it takes that instead",
  sharedAsked.length === 1 && sharedBlocks.length === 0, `${sharedBlocks.length} blocks, ${sharedAsked.length} quick`);
check("and it is told where the pointer is, so it takes the one meant",
  typeof sharedAsked[0]?.x === "number", JSON.stringify(sharedAsked[0]));

// The same key with different counts, which only works because the press is handed over before it is
// counted: one tap is the block's, two are the selection's, and neither ever sees the other's press.
sharedConfig.quickKey = "Control";
sharedConfig.quickTaps = 2;
sharedAsked.length = 0;
sharedBlocks.length = 0;
tap();
check("naming the same key, one tap over a selection does not fire the block",
  sharedBlocks.length === 0, `took ${sharedBlocks.length}`);
check("nor the selection, which was told to wait for the second",
  sharedAsked.length === 0, `fired ${sharedAsked.length}`);
tap();
check("and the second tap takes the selection", sharedAsked.length === 1, `fired ${sharedAsked.length}`);

selectionThere = false;
sharedAsked.length = 0;
tap();
check("while off the selection the one tap is still the block's",
  sharedBlocks.length === 1 && sharedAsked.length === 0, `${sharedBlocks.length} blocks, ${sharedAsked.length} quick`);

// --- what a selection hands over ------------------------------------------
// A field is not in the DOM the way the page's own text is: no selection API reports what is
// highlighted inside it, so it is taken as a range of characters in the value instead.
const field = document.getElementById("quick-field");
field.value = "Words for the quick key to have something to act on.";
field.focus();
field.setSelectionRange(0, 5);
const takenField = takeSelection();
check("text selected in a field is taken", takenField?.text === "Words", JSON.stringify(takenField?.text));
check("and the field itself is what carries the state", takenField?.element === field);
takenField.replace("Mots");
check("replacing writes into the value, leaving the rest alone",
  field.value === "Mots for the quick key to have something to act on.", JSON.stringify(field.value));
takenField.restore();
check("and restoring puts the characters back",
  field.value === "Words for the quick key to have something to act on.", JSON.stringify(field.value));

check("and a field says it is the user's own text, so nothing marks it", takenField.editable === true);

// A password would go out to a translation endpoint like any other string, and a locked field is
// one nothing could be written back to.
field.type = "password";
field.setSelectionRange(0, 5);
check("a password field hands over nothing", takeSelection() === null);
field.type = "text";
field.readOnly = true;
field.setSelectionRange(0, 5);
check("nor does a readonly one", takeSelection() === null);
field.readOnly = false;

// The trigger has nothing to say inside a field either, so the two never argue over one.
check("an editable field is not a block the trigger can take", resolveBlock(field) === null);
check("nor is a textarea", resolveBlock(document.getElementById("quick-area")) === null);
field.blur();

const words = document.getElementById("quick-words");
const range = document.createRange();
range.selectNodeContents(words);
getSelection().removeAllRanges();
getSelection().addRange(range);
// --- where a selection goes, read down the list ---------------------------
const order = [
  { group: "latin", lang: "en" },
  { group: "han", lang: "" },
  { group: "kana", lang: "fr" },
  { group: "hangul", lang: "" },
];
check("a row that names a language answers with it", targetForGroup(order, "latin", "xx") === "en");
check("one that names none takes the row above it", targetForGroup(order, "han", "xx") === "en");
check("and keeps taking the nearest one named above", targetForGroup(order, "hangul", "xx") === "fr",
  targetForGroup(order, "hangul", "xx"));
check("a script with no row at all falls back", targetForGroup(order, "arabic", "xx") === "xx");

const filled = usableOrder([{ group: "han", lang: "" }], null, "de");
check("a stored list keeps its order and gains the rows it is missing",
  filled[0].group === "han" && filled.length === 7, JSON.stringify(filled.map((r) => r.group)));
check("and the top row is never left inheriting from nothing", filled[0].lang === "de", filled[0].lang);
const migrated = usableOrder(undefined, { han: "fr", latin: "" }, "en");
check("the map 1.4.0 stored arrives as a list of the same rows",
  migrated.find((r) => r.group === "han").lang === "fr" && migrated[0].group === "latin" &&
    migrated[0].lang === "en", JSON.stringify(migrated));

// Sharing the trigger's key, a press means the selection only where the selection is: asked with a
// pointer, this is the question "is that what you are pointing at", not "is anything selected".
const spot = words.getBoundingClientRect();
check("a selection under the pointer answers",
  Boolean(selectionAt({ x: spot.left + 4, y: spot.top + spot.height / 2 })));
check("one the pointer is nowhere near does not",
  selectionAt({ x: spot.right + 300, y: spot.top - 200 }) === null);
check("and asked with no pointer at all it answers wherever it is", Boolean(selectionAt()));

const takenRange = takeSelection();
check("text in the page is taken as a span of its own",
  takenRange?.element?.tagName === "SPAN" && takenRange.element.parentElement === words);
check("which is ours to put back, so it is marked and undone like a block", !takenRange.editable);
takenRange.replace("Remplacé");
check("that is where the translation goes", words.textContent === "Remplacé", words.textContent);
takenRange.restore();
check("and putting it back leaves the one text node the page had",
  words.childNodes.length === 1 && words.textContent.startsWith("Words for"), words.childNodes.length);
getSelection().removeAllRanges();

document.getElementById("results").innerHTML =
  out.join("\n") + `\n\n${failures === 0 ? "ALL PASS" : failures + " FAILURE(S)"}`;
document.title = failures === 0 ? "harness: all pass" : `harness: ${failures} failed`;
</script>
</body>
</html>

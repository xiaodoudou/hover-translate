<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>frames and shadow roots</title>
<style>
  body { margin: 0; font: 15px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: #555; }
  iframe { width: 100%; height: 220px; border: 1px solid #ddd; }
  .expect { color: #0e7490; font-size: 13px; }
</style>
<div class="wrap">
  <p class="expect" translate="no">Reproduces a chat embedded in an iframe, plus a shadow root, plus a
  chat bubble nested deep inside a very large container.</p>

  <h2>1. Same-origin iframe, the shape Taobao's chat uses</h2>
  <iframe id="chat-frame" src="frames-child.html"></iframe>

  <h2>2. Open shadow root</h2>
  <div id="shadow-host"></div>

  <h2>3. A bubble deep inside a container larger than the block limit</h2>
  <div id="big-list"></div>
</div>
<script>
  const host = document.getElementById("shadow-host");
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>.m{padding:10px 14px;background:#eef;border-radius:10px;max-width:420px}</style>
    <div class="m" id="shadow-msg">不太明白您的意思</div>`;

  // A conversation long enough that any ancestor holding all of it is refused by BLOCK_MAX_TEXT.
  const big = document.getElementById("big-list");
  let html = '<div class="m" id="deep-msg">不太明白您的意思</div>';
  for (let i = 0; i < 400; i++) html += `<div>这是第 ${i} 条历史消息，用来把容器撑大。</div>`;
  big.innerHTML = html;
</script>
